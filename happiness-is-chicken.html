<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The game is always bright and sunny: opt out of browser auto-darkening -->
<meta name="color-scheme" content="only light">
<meta name="description" content="Happiness Is Chicken! A simple, cheerful egg-laying game for little kids. Tap or press Space to lay an egg.">
<title>Happiness Is Chicken!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 74'%3E%3Cpath d='M30 4C13 4 4 26 4 44a26 26 0 0 0 52 0C56 26 47 4 30 4Z' fill='%23f7f2bc' stroke='%233a3126' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage" aria-label="Happiness Is Chicken game. Tap anywhere, or press Space, to lay an egg.">

  <!-- the star of the show: a round, outlined, flat cartoon chicken -->
  <div id="chicken" aria-hidden="true">
    <svg viewBox="0 0 210 226" role="img">
      <g class="legs" stroke="#3A3126" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M85 158 L78 202 M78 202 l-13 10 M78 202 l10 12"/>
        <path d="M125 158 L131 202 M131 202 l-11 12 M131 202 l12 9"/>
      </g>
      <g class="body">
        <circle cx="105" cy="100" r="64" fill="#FFE23F" stroke="#3A3126" stroke-width="7"/>
        <path class="comb" d="M76 50
          C70 24 94 18 103 33
          C108 14 130 17 130 34
          C143 22 158 35 149 54
          C124 40 98 40 76 50 Z"
          fill="#DE3244" stroke="#3A3126" stroke-width="6" stroke-linejoin="round"/>
        <path class="beak" d="M46 90 L14 102 L48 114 Z"
          fill="#FFC93C" stroke="#3A3126" stroke-width="6" stroke-linejoin="round"/>
        <path class="wing" d="M146 96
          a14 14 0 0 1 26 8
          a14 14 0 0 1 6 24
          a14 14 0 0 1 -22 14
          q-16 -8 -18 -24
          q-2 -14 8 -22 z"
          fill="#FFE23F" stroke="#3A3126" stroke-width="6" stroke-linejoin="round"/>
        <g class="eye-open">
          <circle cx="64" cy="84" r="7" fill="#3A3126"/>
        </g>
        <path class="eye-closed" d="M55 86 q9 7 18 0" stroke="#3A3126" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- dynamic layers -->
  <div id="egg-layer" aria-hidden="true"></div>
  <div id="chick-layer" aria-hidden="true"></div>
  <div id="fx-layer" aria-hidden="true"></div>

  <!-- milestone chick collection (filled in by game.js) -->
  <div id="collection" aria-hidden="true"></div>

  <!-- counters (show-style pills, top-right) -->
  <div class="hud ui">
    <div class="pill" id="egg-pill" title="Eggs laid">
      <svg class="hud-icon" viewBox="0 0 60 74" aria-label="Eggs laid">
        <path d="M30 4C13 4 4 26 4 44a26 26 0 0 0 52 0C56 26 47 4 30 4Z" fill="#F7F2BC" stroke="#3A3126" stroke-width="5"/>
      </svg>
      <span id="egg-count">000</span>
    </div>
    <div class="pill" id="chick-pill" title="Chicks hatched">
      <svg class="hud-icon" viewBox="0 0 90 96" aria-label="Chicks hatched">
        <circle cx="46" cy="50" r="32" fill="#FFE23F" stroke="#3A3126" stroke-width="6"/>
        <path d="M20 46 l-13 5 13 6 z" fill="#FFC93C" stroke="#3A3126" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="33" cy="43" r="4.5" fill="#3A3126"/>
      </svg>
      <span id="chick-count">000</span>
    </div>
  </div>

  <!-- buttons -->
  <div class="controls ui">
    <button id="sound-btn" type="button" aria-label="Turn sound on or off" aria-pressed="true">🔊</button>
    <button id="fs-btn" type="button" aria-label="Fullscreen">⛶</button>
    <button id="gear-btn" type="button" aria-label="Grown-up settings">⚙️</button>
  </div>
</main>

<!-- milestone banner -->
<div id="tier-banner" hidden>
  <svg class="banner-star" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 5 L61 38 L96 38 L68 59 L79 92 L50 71 L21 92 L32 59 L4 38 L39 38 Z" fill="currentColor"/>
  </svg>
  <span id="tier-banner-num">10!</span>
</div>

<!-- start screen -->
<div id="start-overlay">
  <div class="start-card">
    <h1>Happiness Is Chicken!</h1>
    <p class="start-hint">👆 Tap anywhere to play</p>
    <p class="start-hint-small">or press <span class="kbd">Space</span></p>
  </div>
</div>

<!-- grown-up settings -->
<div id="settings-overlay" hidden>
  <div class="settings-card ui" role="dialog" aria-label="Grown-up settings">
    <button id="settings-close" type="button" aria-label="Close settings">✕</button>
    <h2>Grown-ups</h2>
    <div class="settings-row">
      <span class="settings-label">Eggs per hatch</span>
      <div class="threshold-btns">
        <button class="threshold-btn" type="button" data-n="3">3</button>
        <button class="threshold-btn" type="button" data-n="5">5</button>
        <button class="threshold-btn" type="button" data-n="8">8</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">Start over</span>
      <button id="reset-btn" type="button">Reset ↺</button>
      <span id="reset-confirm" hidden>
        <button id="reset-yes" type="button">Yes ✓</button>
        <button id="reset-no" type="button">No ✕</button>
      </span>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
