<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Happy Chicken! A simple, cheerful egg-laying game for little kids. Tap or press Space to lay an egg.">
<title>Happy Chicken!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 74'%3E%3Cpath d='M30 4C13 4 4 26 4 44a26 26 0 0 0 52 0C56 26 47 4 30 4Z' fill='%23fffdf7' stroke='%23e3dccb' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage" aria-label="Happy Chicken game. Tap anywhere, or press Space, to lay an egg.">
  <!-- scenery -->
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud cloud-1" aria-hidden="true"></div>
  <div class="cloud cloud-2" aria-hidden="true"></div>
  <div class="hill hill-1" aria-hidden="true"></div>
  <div class="hill hill-2" aria-hidden="true"></div>
  <div class="grass" aria-hidden="true"></div>

  <!-- the star of the show -->
  <div id="chicken" aria-hidden="true">
    <svg viewBox="0 0 240 260" role="img">
      <g class="legs" stroke="#F79D2C" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M100 205 v37 M100 242 l-13 9 M100 242 l13 9"/>
        <path d="M140 205 v37 M140 242 l-13 9 M140 242 l13 9"/>
      </g>
      <g class="body">
        <ellipse cx="46" cy="118" rx="26" ry="13" fill="#F2B705" transform="rotate(-42 46 118)"/>
        <ellipse cx="42" cy="140" rx="28" ry="13" fill="#FFD34D" transform="rotate(-16 42 140)"/>
        <ellipse cx="118" cy="158" rx="76" ry="60" fill="#FFD34D" stroke="#EFAF17" stroke-width="4"/>
        <circle cx="164" cy="84" r="46" fill="#FFD34D" stroke="#EFAF17" stroke-width="4"/>
        <circle cx="146" cy="44" r="12" fill="#E5484D"/>
        <circle cx="163" cy="35" r="13" fill="#E5484D"/>
        <circle cx="180" cy="44" r="12" fill="#E5484D"/>
        <path d="M208 76 l27 11 -27 12 z" fill="#F79D2C"/>
        <ellipse cx="202" cy="110" rx="8" ry="12" fill="#E5484D"/>
        <ellipse class="wing" cx="92" cy="162" rx="36" ry="24" fill="#F2B705"/>
        <g class="eye-open">
          <circle cx="178" cy="72" r="8" fill="#33302A"/>
          <circle cx="181" cy="69" r="2.6" fill="#FFFFFF"/>
        </g>
        <path class="eye-closed" d="M169 73 q9 7 18 0" stroke="#8a6d1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- dynamic layers -->
  <div id="egg-layer" aria-hidden="true"></div>
  <div id="chick-layer" aria-hidden="true"></div>
  <div id="fx-layer" aria-hidden="true"></div>

  <!-- counters -->
  <div class="hud ui">
    <div class="pill" id="egg-pill" title="Eggs laid">
      <svg class="hud-icon" viewBox="0 0 60 74" aria-label="Eggs laid">
        <path d="M30 4C13 4 4 26 4 44a26 26 0 0 0 52 0C56 26 47 4 30 4Z" fill="#FFFDF7" stroke="#D8CFB8" stroke-width="4"/>
        <ellipse cx="21" cy="26" rx="6" ry="9" fill="#FFFFFF"/>
      </svg>
      <span id="egg-count">0</span>
    </div>
    <div class="pill" id="chick-pill" title="Chicks hatched">
      <svg class="hud-icon" viewBox="0 0 90 96" aria-label="Chicks hatched">
        <circle cx="46" cy="48" r="32" fill="#FFE45E" stroke="#EFC93D" stroke-width="4"/>
        <path d="M74 44 l14 6 -14 7 z" fill="#F79D2C"/>
        <circle cx="62" cy="40" r="4.5" fill="#33302A"/>
        <circle cx="63.5" cy="38.5" r="1.5" fill="#FFFFFF"/>
      </svg>
      <span id="chick-count">0</span>
    </div>
  </div>

  <!-- buttons -->
  <div class="controls ui">
    <button id="sound-btn" type="button" aria-label="Turn sound on or off" aria-pressed="true">🔊</button>
    <button id="fs-btn" type="button" aria-label="Fullscreen">⛶</button>
    <button id="gear-btn" type="button" aria-label="Grown-up settings">⚙️</button>
  </div>
</main>

<!-- start screen -->
<div id="start-overlay">
  <div class="start-card">
    <h1>Happy Chicken!</h1>
    <p class="start-hint">👆 Tap anywhere to play</p>
    <p class="start-hint-small">or press <span class="kbd">Space</span></p>
  </div>
</div>

<!-- grown-up settings -->
<div id="settings-overlay" hidden>
  <div class="settings-card ui" role="dialog" aria-label="Grown-up settings">
    <button id="settings-close" type="button" aria-label="Close settings">✕</button>
    <h2>Grown-ups</h2>
    <div class="settings-row">
      <span class="settings-label">Eggs per hatch</span>
      <div class="threshold-btns">
        <button class="threshold-btn" type="button" data-n="3">3</button>
        <button class="threshold-btn" type="button" data-n="5">5</button>
        <button class="threshold-btn" type="button" data-n="8">8</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">Start over</span>
      <button id="reset-btn" type="button">Reset ↺</button>
      <span id="reset-confirm" hidden>
        <button id="reset-yes" type="button">Yes ✓</button>
        <button id="reset-no" type="button">No ✕</button>
      </span>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
